{% extends "base.html" %}
{% block css %}
<link rel="stylesheet" href="../static/css/t2.css">
{%endblock%}
{%block content%}

<section class="T2-collect">
    <div class="formContainer">
        <form id="insertT2Data" action="/getSearchCriteriaAdv">
            <h3>NASA API SEARCH CRITERIA</h3>
            <fieldset>
                <p>
                    <label>Search Engine</label>
                    <input type="text" placeholder="Search For..." size="24" maxlength="40" name="input_text" required>
                </p>
                <p>
                    <label></label>
                    <input id="submitForm" type="submit" name="submit" value="Launch Search" id=buttonS />
                </p>
            </fieldset>

        </form>
    </div>

    <div class="formDisplayContainer">
        {% if have_results == True%}
        <p>{{description}}</p>
        <img src={{imgPath}} />
        {%endif%}
    </div>
</section>
{%endblock%}
